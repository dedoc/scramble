name: Compile assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: compile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile assets
        run: npm run build

      - name: Commit compiled assets
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.0.0
        with:
          commit_message: Compile assets
          file_pattern: dist/
          skip_push: ${{ env.ACT == 'true' }}
